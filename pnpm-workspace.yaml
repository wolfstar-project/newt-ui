packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"

autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: true

# Drop-in `typescript` replacement whose checker runs on tsgo (Microsoft's Go
# TypeScript compiler) in-process. Must be an exact version: the fork only
# publishes prerelease versions, which caret ranges never match.
overrides:
  typescript: npm:typescript-native-bridge@6.0.3-bridge.13.tsgo.7.0.2
  # Two @nuxt/schema instances mean two nominally different `DefineNuxtConfig`
  # types, so `defineNuxtConfig(...)` type-checks as "not callable" wherever the
  # older one wins resolution. Everything here runs Nuxt 4.
  "@nuxt/schema": npm:@nuxt/schema@4.6.4
  # The rolldown wasm binding pins the emnapi 2.0 beta, and pnpm then hands that
  # runtime to Astro's language server as a peer beside emnapi core 1.x. The two
  # do not fit together: `blume check` crashes with "setLastError is not a
  # function". Nothing here runs the wasm binding, so every package gets 1.x.
  "@emnapi/core": ^1.11.3
  "@emnapi/runtime": ^1.11.3

allowBuilds:
  "@google/genai": true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  vue-demi: true
