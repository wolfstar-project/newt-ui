packages:
  - "apps/*"
  - "packages/*"
  - "deprecated/*"
  - "templates/*"

autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: true

# Drop-in `typescript` replacement whose checker runs on tsgo (Microsoft's Go
# TypeScript compiler) in-process. Must be an exact version: the fork only
# publishes prerelease versions, which caret ranges never match.
overrides:
  typescript: npm:typescript-native-bridge@6.0.3-bridge.13.tsgo.7.0.2
  # Two @nuxt/schema instances mean two nominally different `DefineNuxtConfig`
  # types, so `defineNuxtConfig(...)` type-checks as "not callable" wherever the
  # older one wins resolution. Everything here runs Nuxt 4.
  "@nuxt/schema": npm:@nuxt/schema@4.5.2
  # spike: Lotus requires vite ^8.3.0 / @astrojs/mdx ^8.0.1; without these the
  # monorepo ends up with two Vite instances (Astro on 8.2.2, Lotus's Tailwind
  # plugin on 8.3.0).
  vite: ^8.3.0
  "@astrojs/mdx": ^8.0.1

allowBuilds:
  "@google/genai": true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  vue-demi: true

patchedDependencies:
  '@prosefly/astro-theme-lotus@0.8.0': patches/@prosefly__astro-theme-lotus@0.8.0.patch
  astro-takumi@2.0.1: patches/astro-takumi@2.0.1.patch
