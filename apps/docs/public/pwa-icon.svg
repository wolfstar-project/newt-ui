<!--
  The installed app's icon. The favicon next to it uses the `Canvas`/`CanvasText`
  system colours so it follows the reader's theme, which a rasteriser cannot
  resolve — an installed icon sits on somebody else's home screen and has to
  carry its own colours, so this one states them.
-->
