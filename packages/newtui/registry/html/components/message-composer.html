<div
  class="newt-composer"
  role="group"
  aria-label="Message composer for #general"
>
  <button
    class="newt-composer__button"
    type="button"
    aria-label="Add attachment"
  >
    <svg class="newt-composer__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M11 5a1 1 0 1 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6z"
      />
    </svg>
  </button>
  <div class="newt-composer__field">
    <input
      class="newt-composer__input"
      type="text"
      placeholder="Message #general"
      aria-label="Message #general"
      spellcheck="false"
    />
  </div>
  <button
    class="newt-composer__button newt-composer__send"
    type="button"
    aria-label="Send message"
    disabled
  >
    <svg class="newt-composer__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M3 20.5v-6l8-2.5-8-2.5v-6l19 8.5z" />
    </svg>
  </button>
</div>
