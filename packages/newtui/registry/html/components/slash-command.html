<span class="newt-command" role="group" aria-label="Slash command /ban member">
  <span class="newt-command__icon" aria-hidden="true">/</span>
  <span class="newt-command__name">ban</span>
  <span class="newt-command__segment">member</span>
  <span class="newt-command__option">
    <span class="newt-command__option-name">user</span>
    <span class="newt-command__option-value">@username</span>
  </span>
  <span class="newt-command__option newt-command__option--focused">
    <span class="newt-command__option-name">reason</span>
    <span class="newt-command__option-placeholder">why they were banned</span>
  </span>
</span>
