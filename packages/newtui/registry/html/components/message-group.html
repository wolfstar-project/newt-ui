<div class="newt-message-group newt-message-group--with-reply">
  <div class="newt-message-group__reply">
    <div class="newt-reply">
      <span class="newt-reply__author">@someone</span>
      <span class="newt-reply__text">original message text</span>
    </div>
  </div>
  <div class="newt-message-group__avatar">
    <div class="newt-status">
      <div class="newt-avatar">U</div>
      <div class="newt-status__dot newt-status__dot--online"></div>
    </div>
  </div>
  <div class="newt-message-group__body">
    <div class="newt-message-group__header">
      <span class="newt-message-group__author">username</span>
      <span
        class="newt-message-group__author--bot"
        role="img"
        aria-label="Verified application"
      >
        <svg
          class="newt-message-group__verified-check"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="currentColor"
            d="M9.55 17.6 4.4 12.45l1.4-1.4 3.75 3.75 8.65-8.65 1.4 1.4z"
          />
        </svg>
        BOT
      </span>
      <time
        class="newt-message-group__time"
        datetime="2026-09-04T14:23:00.000Z"
      >
        Today at 14:23
      </time>
    </div>
    <div class="newt-message-group__content">Message content goes here.</div>
    <div class="newt-message-group__reactions">
      <button class="newt-reaction" aria-pressed="false">
        <span aria-hidden="true">👍</span
        ><span class="newt-reaction__count">1</span>
      </button>
    </div>
  </div>
</div>
<div class="newt-message-group newt-message-group--ephemeral">
  <div class="newt-message-group__avatar">
    <div class="newt-avatar">B</div>
  </div>
  <div class="newt-message-group__body">
    <div class="newt-message-group__header">
      <span class="newt-message-group__author">botname</span>
      <span class="newt-message-group__author--bot">APP</span>
    </div>
    <div class="newt-message-group__content">Command ran successfully.</div>
    <div class="newt-message-group__ephemeral-notice" role="status">
      Only you can see this •
      <button class="newt-message-group__ephemeral-action" type="button">
        Dismiss message
      </button>
    </div>
  </div>
</div>
