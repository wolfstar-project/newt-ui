<div class="newt-poll">
  <p class="newt-poll__question">Which day works for the raid?</p>
  <div class="newt-poll__answers">
    <button
      class="newt-poll__answer newt-poll__answer--chosen"
      type="button"
      aria-pressed="true"
    >
      <span class="newt-poll__emoji" aria-hidden="true">🌙</span>
      <span
        class="newt-poll__bar"
        style="inline-size: 62%"
        aria-hidden="true"
      ></span>
      <span class="newt-poll__label">Friday night</span>
      <span class="newt-poll__share">62%</span>
    </button>
    <button class="newt-poll__answer" type="button" aria-pressed="false">
      <span class="newt-poll__emoji" aria-hidden="true">☀️</span>
      <span
        class="newt-poll__bar"
        style="inline-size: 38%"
        aria-hidden="true"
      ></span>
      <span class="newt-poll__label">Sunday afternoon</span>
      <span class="newt-poll__share">38%</span>
    </button>
  </div>
  <div class="newt-poll__footer">21 votes · 4 hours left</div>
</div>
