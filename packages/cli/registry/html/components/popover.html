<div class="newt-popover" data-newt-popover>
  <button
    class="newt-btn newt-btn--secondary newt-popover__trigger"
    type="button"
    aria-expanded="true"
    aria-controls="newt-popover-example"
  >
    Notification settings
  </button>
  <div
    class="newt-popover__content"
    id="newt-popover-example"
    role="dialog"
    aria-label="Notification settings"
  >
    <p class="newt-popover__title">Mute this channel</p>
    <p class="newt-popover__text">
      You will not be notified unless you are mentioned.
    </p>
    <button class="newt-btn newt-btn--primary" type="button">
      Mute for 1 hour
    </button>
  </div>
</div>
