<div class="newt-checkgroup" role="group" aria-label="Which days are you free?">
  <label class="newt-checkgroup__row">
    <input
      class="newt-checkgroup__input"
      type="checkbox"
      name="days"
      value="mon"
      checked
    />
    <span class="newt-checkgroup__box" aria-hidden="true">
      <svg class="newt-checkgroup__check" viewBox="0 0 16 16">
        <path
          fill="currentColor"
          d="M6.2 11.6 3.1 8.5a1 1 0 0 1 1.4-1.4l1.7 1.7 4.3-4.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0Z"
        />
      </svg>
    </span>
    <span class="newt-checkgroup__text">
      <span>Monday</span>
    </span>
  </label>
  <label class="newt-checkgroup__row">
    <input
      class="newt-checkgroup__input"
      type="checkbox"
      name="days"
      value="sat"
    />
    <span class="newt-checkgroup__box" aria-hidden="true">
      <svg class="newt-checkgroup__check" viewBox="0 0 16 16">
        <path
          fill="currentColor"
          d="M6.2 11.6 3.1 8.5a1 1 0 0 1 1.4-1.4l1.7 1.7 4.3-4.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0Z"
        />
      </svg>
    </span>
    <span class="newt-checkgroup__text">
      <span>Saturday</span>
      <span class="newt-checkgroup__description"
        >Short notice, but possible</span
      >
    </span>
  </label>
</div>
