<div class="newt-reaction-group">
  <button
    class="newt-reaction newt-reaction--active"
    type="button"
    aria-pressed="true"
  >
    <span aria-hidden="true">👍</span
    ><span class="newt-reaction__count">12</span>
  </button>
  <button class="newt-reaction" type="button" aria-pressed="false">
    <span aria-hidden="true">🚀</span
    ><span class="newt-reaction__count">4</span>
  </button>
  <button
    class="newt-reaction"
    type="button"
    aria-pressed="false"
    aria-label="star reaction, 2 people"
  >
    <span class="newt-reaction__emoji" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" focusable="false">
        <path
          fill="currentColor"
          d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"
        />
      </svg> </span
    ><span class="newt-reaction__count">2</span>
  </button>
</div>
