<!--
  data-side="top" on the root opens the panel above the trigger; it still
  flips when that side has no room. data-align="center" or "end" on the panel
  lines up a panel that is not as wide as the trigger.
-->
<div class="newt-select-menu" data-newt-select>
  <button
    class="newt-select-menu__trigger"
    data-slot="select-menu-trigger"
    type="button"
    role="combobox"
    aria-haspopup="listbox"
    aria-expanded="false"
    aria-controls="select-menu-listbox"
  >
    <span class="newt-select-menu__leading">
      <svg
        class="newt-select-menu__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-6v2h3a1 1 0 1 1 0 2H7a1 1 0 1 1 0-2h3v-2H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1 2v7h14V7H5Z"
        />
      </svg>
      <span class="newt-select-menu__value">Windows Default</span>
      <span class="newt-select-menu__note">(Odyssey G85SD)</span>
    </span>
    <svg
      class="newt-select-menu__chevron"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path
        fill="currentColor"
        d="M5.3 9.3a1 1 0 0 1 1.4 0l5.3 5.29 5.3-5.3a1 1 0 1 1 1.4 1.42l-6 6a1 1 0 0 1-1.4 0l-6-6a1 1 0 0 1 0-1.42Z"
      />
    </svg>
  </button>
  <div
    class="newt-select-menu__panel"
    data-slot="select-menu-content"
    data-placement="below"
    hidden
  >
    <ul
      class="newt-select-menu__listbox"
      id="select-menu-listbox"
      role="listbox"
      aria-label="Select an option"
    >
      <li
        class="newt-select-menu__option"
        id="select-menu-option-0"
        role="option"
        aria-selected="false"
        data-value="one"
      >
        <span class="newt-select-menu__option-body">
          <span class="newt-select-menu__option-label">Option one</span>
          <span class="newt-select-menu__option-description">
            What this option does
          </span>
        </span>
      </li>
      <li
        class="newt-select-menu__option"
        id="select-menu-option-1"
        role="option"
        aria-selected="false"
        data-value="two"
      >
        <!-- An emoji stands where an icon would, for an option without one. -->
        <span class="newt-select-menu__option-emoji" aria-hidden="true"
          >🎲</span
        >
        <span class="newt-select-menu__option-body">
          <span class="newt-select-menu__option-label">Option two</span>
        </span>
      </li>
      <li
        class="newt-select-menu__option"
        id="select-menu-option-2"
        role="option"
        aria-selected="false"
        aria-disabled="true"
        data-value="three"
      >
        <span class="newt-select-menu__option-body">
          <span class="newt-select-menu__option-label">Option three</span>
        </span>
      </li>
    </ul>
  </div>
</div>
