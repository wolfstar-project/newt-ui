<div class="newt-invite">
  <span class="newt-invite__eyebrow">
    You've been invited to join a server
  </span>
  <div class="newt-invite__body">
    <img
      class="newt-invite__icon"
      src="/server.png"
      alt=""
      aria-hidden="true"
    />
    <div class="newt-invite__info">
      <a class="newt-invite__name" href="https://example.com/invite">
        Server name
      </a>
      <div class="newt-invite__counts">
        <span class="newt-invite__count newt-invite__count--online">
          <span class="newt-invite__dot" aria-hidden="true"></span>
          1,024 Online
        </span>
        <span class="newt-invite__count">
          <span class="newt-invite__dot" aria-hidden="true"></span>
          8,192 Members
        </span>
      </div>
    </div>
    <a class="newt-btn newt-btn--success" href="https://example.com/invite">
      Join
    </a>
  </div>
</div>
