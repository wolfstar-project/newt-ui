<article class="newt-app-invite" aria-labelledby="app-invite-name">
  <img
    class="newt-app-invite__banner"
    src="/app-banner.png"
    alt=""
    aria-hidden="true"
  />
  <div class="newt-app-invite__body">
    <div class="newt-app-invite__header">
      <img
        class="newt-app-invite__icon"
        src="/app-icon.png"
        alt=""
        aria-hidden="true"
      />
      <div class="newt-app-invite__info">
        <a
          id="app-invite-name"
          class="newt-app-invite__name"
          href="https://example.com/app"
        >
          App name
        </a>
        <p class="newt-app-invite__description">
          Moderation, reminders and slash commands for your server.
        </p>
      </div>
    </div>
    <a
      class="newt-btn newt-btn--secondary newt-app-invite__action"
      href="https://example.com/app"
    >
      Learn More
    </a>
  </div>
</article>
