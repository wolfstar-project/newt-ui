<div
  class="newt-channel-info"
  role="dialog"
  aria-label="Channel information for #general"
>
  <div class="newt-channel-info__toolbar">
    <button
      type="button"
      class="newt-channel-info__action"
      aria-label="Back to channel"
    >
      <svg
        viewBox="0 0 20 20"
        width="20"
        height="20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M8.7 3.3 2 10l6.7 6.7 1.4-1.4L5.8 11H18V9H5.8l4.3-4.3-1.4-1.4Z"
        />
      </svg>
    </button>

    <div class="newt-channel-info__actions">
      <button
        type="button"
        class="newt-channel-info__action"
        aria-label="Search"
      >
        <svg
          viewBox="0 0 20 20"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="9" r="5.5" />
          <path d="M13 13l4 4" />
        </svg>
      </button>
      <button
        type="button"
        class="newt-channel-info__action"
        aria-label="Notification settings"
      >
        <svg
          viewBox="0 0 20 20"
          width="20"
          height="20"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M10 2a5 5 0 0 0-5 5v3.5L3.5 13v1h13v-1L15 10.5V7a5 5 0 0 0-5-5Zm0 16a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 10 18Z"
          />
        </svg>
      </button>
    </div>
  </div>

  <div class="newt-channel-info__identity">
    <div class="newt-channel-info__icon" aria-hidden="true">#</div>
    <div>
      <div class="newt-channel-info__name">general</div>
      <div class="newt-channel-info__type">Text Channel</div>
    </div>
  </div>

  <div
    class="newt-tabs"
    role="tablist"
    aria-label="Channel information sections"
  >
    <button
      type="button"
      class="newt-tab newt-tab--active"
      role="tab"
      aria-selected="true"
    >
      Members
    </button>
    <button
      type="button"
      class="newt-tab"
      role="tab"
      aria-selected="false"
      tabindex="-1"
    >
      Pins
    </button>
    <button
      type="button"
      class="newt-tab"
      role="tab"
      aria-selected="false"
      tabindex="-1"
    >
      Threads
    </button>
  </div>

  <div class="newt-channel-info__panel" role="tabpanel" aria-label="Threads">
    <div class="newt-channel-info__empty">
      <div class="newt-channel-info__empty-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="32"
          height="32"
          fill="currentColor"
          aria-hidden="true"
        >
          <path d="M4 4h16v10H8l-4 4V4Z" />
        </svg>
      </div>
      <p class="newt-channel-info__empty-title">There are no threads.</p>
      <p class="newt-channel-info__empty-body">
        Stay focused on a conversation with a thread &mdash; a temporary text
        channel.
      </p>
    </div>
  </div>
</div>
