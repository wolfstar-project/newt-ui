<section class="newt-user-panel" aria-label="User controls">
  <div class="newt-status" role="status" aria-label="Online">
    <div class="newt-avatar newt-avatar--sm">A</div>
    <div class="newt-status__dot newt-status__dot--online"></div>
  </div>
  <div class="newt-user-panel__info">
    <span class="newt-user-panel__name">ada</span>
    <span class="newt-user-panel__status">Online</span>
  </div>
  <div class="newt-user-panel__actions">
    <button
      class="newt-user-panel__button"
      type="button"
      aria-label="Mute"
      aria-pressed="true"
      data-newt-toggle
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          fill="currentColor"
          d="M8 1.5a2 2 0 0 0-2 2v4a2 2 0 0 0 4 0v-4a2 2 0 0 0-2-2Z"
        />
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5"
        />
        <path class="newt-user-panel__slash" d="M2.5 2.5l11 11" />
      </svg>
    </button>
    <button
      class="newt-user-panel__button"
      type="button"
      aria-label="Deafen"
      aria-pressed="false"
      data-newt-toggle
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          d="M2.75 9.5V8a5.25 5.25 0 0 1 10.5 0v1.5"
        />
        <rect x="2" y="9" width="3" height="5" rx="1" fill="currentColor" />
        <rect x="11" y="9" width="3" height="5" rx="1" fill="currentColor" />
        <path class="newt-user-panel__slash" d="M2.5 2.5l11 11" />
      </svg>
    </button>
    <button
      class="newt-user-panel__button"
      type="button"
      aria-label="User settings"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle
          cx="8"
          cy="8"
          r="5.2"
          fill="none"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-dasharray="2.2 1.88"
        />
        <circle
          cx="8"
          cy="8"
          r="2.4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
      </svg>
    </button>
  </div>
</section>
