<button class="newt-btn newt-btn--primary" type="button">Primary</button>
<button class="newt-btn newt-btn--secondary" type="button">Secondary</button>
<button class="newt-btn newt-btn--success" type="button">Success</button>
<button class="newt-btn newt-btn--danger" type="button">Danger</button>
<button class="newt-btn newt-btn--secondary" type="button">
  <img class="newt-btn__emoji" src="/emoji.png" alt="" aria-hidden="true" />
  <span class="newt-btn__label">With emoji</span>
</button>
<a class="newt-btn newt-btn--link" href="https://example.com">
  <span class="newt-btn__label">Link button</span>
  <svg
    class="newt-btn__launch"
    viewBox="0 0 24 24"
    aria-hidden="true"
    focusable="false"
  >
    <path
      fill="currentColor"
      d="M10 5a1 1 0 0 0 0 2h6.59L4.3 19.3a1 1 0 1 0 1.4 1.4L18 8.42V15a1 1 0 1 0 2 0V6a1 1 0 0 0-1-1h-9Z"
    />
  </svg>
</a>
<button class="newt-btn newt-btn--secondary newt-btn--message" type="button">
  <span class="newt-btn__leading">
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path
        fill="currentColor"
        d="M11 5a1 1 0 1 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5Z"
      />
    </svg>
  </span>
  <span class="newt-btn__label">Add role</span>
</button>
<button class="newt-btn newt-btn--primary newt-btn--message" type="button">
  <span class="newt-btn__label">Celebrate</span>
  <span class="newt-btn__trailing" aria-hidden="true">🎉</span>
</button>
