<div
  class="newt-composer"
  role="group"
  aria-label="Message composer for #general"
>
  <button
    class="newt-composer__button"
    type="button"
    aria-label="Add attachment"
  >
    <svg class="newt-composer__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M11 5a1 1 0 1 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6z"
      />
    </svg>
  </button>
  <div class="newt-composer__field">
    <input
      class="newt-composer__input"
      type="text"
      placeholder="Message #general"
      aria-label="Message #general"
      spellcheck="false"
    />
  </div>
  <button
    class="newt-composer__button newt-composer__send"
    type="button"
    aria-label="Send message"
    disabled
  >
    <svg class="newt-composer__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M3 20.5v-6l8-2.5-8-2.5v-6l19 8.5z" />
    </svg>
  </button>
</div>

<!--
  Narrow layout, for a phone. A leading apps button sits after the add button.
  While the field is empty, a trailing microphone takes the place of send.
-->
<div
  class="newt-composer newt-composer--narrow"
  role="group"
  aria-label="Message composer for #general"
>
  <button
    class="newt-composer__button newt-composer__button--narrow"
    type="button"
    aria-label="Add attachment"
  >
    <svg class="newt-composer__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M11 5a1 1 0 1 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6z"
      />
    </svg>
  </button>
  <button
    class="newt-composer__button newt-composer__button--narrow"
    type="button"
    aria-label="Apps"
  >
    <svg class="newt-composer__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"
      />
    </svg>
  </button>
  <div class="newt-composer__field">
    <input
      class="newt-composer__input"
      type="text"
      placeholder="Message #general"
      aria-label="Message #general"
      spellcheck="false"
    />
    <button class="newt-composer__button" type="button" aria-label="Emoji">
      <svg class="newt-composer__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM8.5 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM12 18a5.5 5.5 0 0 1-5-3.2h10A5.5 5.5 0 0 1 12 18z"
        />
      </svg>
    </button>
  </div>
  <button
    class="newt-composer__button newt-composer__button--narrow"
    type="button"
    aria-label="Record a voice message"
  >
    <svg class="newt-composer__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zm-7 9a1 1 0 1 1 2 0 5 5 0 0 0 10 0 1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-3.07A7 7 0 0 1 5 11z"
      />
    </svg>
  </button>
</div>
