<div class="newt-number" data-newt-number>
  <button
    class="newt-number__step"
    type="button"
    data-newt-number-step="-1"
    aria-label="Decrease"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path fill="currentColor" d="M3 7h10a1 1 0 1 1 0 2H3a1 1 0 0 1 0-2Z" />
    </svg>
  </button>
  <input
    class="newt-number__input"
    type="number"
    inputmode="numeric"
    min="0"
    max="120"
    step="5"
    value="15"
    aria-label="Slowmode, in seconds"
  />
  <button
    class="newt-number__step"
    type="button"
    data-newt-number-step="1"
    aria-label="Increase"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path
        fill="currentColor"
        d="M8 2a1 1 0 0 1 1 1v4h4a1 1 0 1 1 0 2H9v4a1 1 0 1 1-2 0V9H3a1 1 0 0 1 0-2h4V3a1 1 0 0 1 1-1Z"
      />
    </svg>
  </button>
</div>
