<header class="newt-channel-header">
  <div class="newt-channel-header__info">
    <span class="newt-channel-header__icon" aria-hidden="true">#</span>
    <span class="newt-channel-header__name">general</span>
    <span class="newt-channel-header__divider" aria-hidden="true"></span>
    <span class="newt-channel-header__topic">
      Say hello and tell us what you are building.
    </span>
  </div>

  <div class="newt-channel-header__toolbar">
    <button
      type="button"
      class="newt-channel-header__action"
      aria-label="Pinned messages"
    >
      <svg
        viewBox="0 0 24 24"
        width="24"
        height="24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path d="M14 3v6l3 3v2h-4v6l-1 1-1-1v-6H7v-2l3-3V3h4Z" />
      </svg>
    </button>
    <button
      type="button"
      class="newt-channel-header__action"
      data-state="active"
      aria-label="Hide member list"
      aria-pressed="true"
    >
      <svg
        viewBox="0 0 24 24"
        width="24"
        height="24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 19a7 7 0 0 1 14 0v1H2v-1Zm15.5-6a5.5 5.5 0 0 1 4.5 5.4V20h-4v-1a8.9 8.9 0 0 0-1.6-5.1c.35-.06.72-.09 1.1-.09Z"
        />
      </svg>
    </button>

    <button
      type="button"
      class="newt-channel-header__search"
      aria-label="Search"
    >
      <span class="newt-channel-header__search-label">Search</span>
      <svg
        viewBox="0 0 16 16"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="7" cy="7" r="4.5" />
        <path d="M10.5 10.5 14 14" />
      </svg>
    </button>
  </div>
</header>
