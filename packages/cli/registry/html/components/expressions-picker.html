<!-- Load tokens.css and expressions-picker.css; load expressions-picker.js with defer.
     The script draws the sections from the JSON in data-newt-expressions-data. -->
<div class="newt-expressions-picker" data-newt-expressions-picker>
  <button
    type="button"
    class="newt-expressions-picker__trigger"
    data-newt-trigger
    aria-haspopup="dialog"
    aria-expanded="false"
  >
    Choose an expression
  </button>
  <dialog
    class="newt-expressions-picker__panel"
    data-newt-dialog
    aria-label="Choose an expression"
  >
    <div class="newt-expressions-picker__header">
      <div
        role="tablist"
        aria-label="Expression type"
        class="newt-expressions-picker__tabs"
      >
        <button
          type="button"
          role="tab"
          class="newt-expressions-picker__control"
          data-newt-kind="gif"
          aria-selected="false"
          tabindex="-1"
        >
          GIFs</button
        ><button
          type="button"
          role="tab"
          class="newt-expressions-picker__control"
          data-newt-kind="sticker"
          aria-selected="false"
          tabindex="-1"
        >
          Stickers</button
        ><button
          type="button"
          role="tab"
          class="newt-expressions-picker__control"
          data-newt-kind="emoji"
          aria-selected="true"
          tabindex="0"
        >
          Emoji
        </button>
      </div>
    </div>
    <div class="newt-expressions-picker__toolbar">
      <div class="newt-expressions-picker__search-field">
        <input
          type="text"
          class="newt-expressions-picker__search"
          data-newt-search
          autocomplete="off"
          spellcheck="false"
          aria-label="Search expressions"
          placeholder="Search by name or keyword"
        />
        <svg
          class="newt-expressions-picker__search-icon"
          aria-hidden="true"
          viewBox="0 0 16 16"
        >
          <circle cx="7" cy="7" r="5" />
          <path d="m11 11 4 4" stroke-linecap="round" />
        </svg>
        <button
          type="button"
          class="newt-expressions-picker__control newt-expressions-picker__clear"
          data-newt-clear
          aria-label="Clear search"
          hidden
        >
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="newt-expressions-picker__tone" data-newt-tone>
        <button
          type="button"
          class="newt-expressions-picker__control newt-expressions-picker__tone-button"
          data-newt-tone-button
          aria-expanded="false"
          aria-label="Skin tone: Default skin tone"
        >
          <span aria-hidden="true" class="newt-expressions-picker__glyph"
            >👋</span
          >
        </button>
        <div
          class="newt-expressions-picker__tones"
          data-newt-tones
          role="group"
          aria-label="Skin tone"
          hidden
        ></div>
      </div>
    </div>
    <div class="newt-expressions-picker__body" role="tabpanel" data-newt-panel>
      <nav
        class="newt-expressions-picker__rail"
        data-newt-rail
        aria-label="Categories"
      ></nav>
      <div class="newt-expressions-picker__scroll" data-newt-scroll></div>
    </div>
    <div class="newt-expressions-picker__footer" data-newt-footer></div>
  </dialog>
