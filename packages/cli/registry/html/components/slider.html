<div class="newt-slider" style="--newt-slider-ratio: 0.4" data-newt-slider>
  <div class="newt-slider__marks" aria-hidden="true">
    <span class="newt-slider__mark" style="--newt-slider-at: 0">0%</span>
    <span class="newt-slider__mark" style="--newt-slider-at: 0.5">100%</span>
    <span class="newt-slider__mark" style="--newt-slider-at: 1">200%</span>
  </div>
  <div class="newt-slider__control">
    <input
      class="newt-slider__input"
      type="range"
      min="0"
      max="200"
      step="1"
      value="80"
      aria-label="Output volume"
    />
    <div class="newt-slider__track">
      <div class="newt-slider__fill"></div>
    </div>
    <div class="newt-slider__thumb"></div>
  </div>
</div>
