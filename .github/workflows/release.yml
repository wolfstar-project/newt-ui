name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CI: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot_filter:
    name: Snapshot filter
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'wolfstar-project'
      && (
          (github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore: version packages') && !contains(github.event.head_commit.message, 'chore: update changelog and release'))
          || github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.snapshot_changes.outputs.publish }}
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check snapshot changes
        id: snapshot_changes
        shell: bash
        # Context values go through `env:` rather than `${{ }}` in the script,
        # so they reach bash as plain strings and cannot inject code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Assigned separately so a failed `git diff` fails the step instead
          # of silently resolving to "no relevant changes".
          changed_files="$(git diff --name-only "$EVENT_BEFORE" "$HEAD_SHA")"
          if echo "$changed_files" | grep -qE '^(packages/|deprecated/|package.json$)'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  snapshot:
    name: Publish @next snapshot
    runs-on: ubuntu-latest
    needs: snapshot_filter
    if: |
      github.repository_owner == 'wolfstar-project'
      && needs.snapshot_filter.outputs.publish == 'true'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js v24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish snapshot
        run: pnpm run publish:snapshot
        env:
          # The v3 changelog generator queries GitHub while versioning snapshots.
          GITHUB_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
          # No NPM_TOKEN/NODE_AUTH_TOKEN: npm authenticates via OIDC trusted
          # publishing (id-token: write above), which also implies provenance.

  release:
    name: Create Release PR or Publish
    runs-on: ubuntu-latest
    if: github.repository_owner == 'wolfstar-project'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.WOLFSTAR_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js v24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # No NPM_TOKEN/NODE_AUTH_TOKEN: npm authenticates via OIDC trusted
      # publishing (id-token: write above), which also implies provenance.
      - name: Process Changesets
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.WOLFSTAR_TOKEN }}
          publish-script: pnpm run publish
          pr-title: "chore: update changelog and release"
          commit-message: "chore: update changelog and release"
