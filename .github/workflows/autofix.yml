# needed to securely identify the workflow
name: autofix.ci

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code:
    name: 🤖 Autofix code
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-toolchain

      - name: 🔠 Fix formatting
        run: pnpm run format

      # merge_group events have no pull_request payload, so the autofix action
      # would target the synthetic gh-readonly-queue/... ref. Keep merge-queue
      # runs check-only and only hand off fixes on pull_request events.
      - name: 🔍 Verify formatting (merge queue)
        if: github.event_name == 'merge_group'
        run: git diff --exit-code

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        if: github.event_name == 'pull_request'
