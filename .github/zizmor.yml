# Existing privileged PR automation is intentionally isolated to these workflows:
# they do not checkout pull request head code, and they only comment or set status.
rules:
  dangerous-triggers:
    ignore:
      - semantic-pull-requests.yml
  # pkg.pr.new publishes preview tarballs to its own service, authenticated by
  # the pkg-pr-new GitHub App and the workflow run identity. There is no npm
  # registry credential involved, so trusted publishing does not apply.
  use-trusted-publishing:
    ignore:
      - pkg-pr-new.yml
